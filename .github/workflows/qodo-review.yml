# Optional Actions-based PR-Agent. The hackathon's required reviewer is the
# Qodo GitHub App (https://app.qodo.ai/signin). If the App is installed,
# comment `/agentic_review` on the PR. This workflow is a backup when
# OPENAI_KEY (or OPENAI_API_KEY) is set in repo secrets.
name: Qodo PR Review Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qodo_review_job:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Qodo PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_FILE: '.pr_agent.toml'
